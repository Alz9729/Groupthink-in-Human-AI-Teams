<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮IRIS 2.0 : Your Game Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .bounce-1 { animation: bounce 1s infinite 0ms; }
        .bounce-2 { animation: bounce 1s infinite 150ms; }
        .bounce-3 { animation: bounce 1s infinite 300ms; }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
            70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
        .recording { animation: pulse-ring 1.2s infinite; background: #dc2626 !important; color: white !important; }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fade-in 0.25s ease-out; }

    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-900 to-blue-900 min-h-screen text-white">

    <!-- Participant ID Modal -->
    <div id="participantModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white/15 backdrop-blur-md border border-white/30 rounded-2xl p-8 max-w-sm w-full mx-4 text-white text-center shadow-2xl">
            <div class="text-4xl mb-3">🎮</div>
            <h2 class="text-xl font-bold mb-1">Welcome to IRIS</h2>
            <p class="text-purple-200 text-sm mb-6">Your Game Buddy Decision Maker</p>
            <label for="participantIdInput" class="block text-sm font-semibold text-purple-200 mb-2 text-left">Participant ID</label>
            <input
                type="text"
                id="participantIdInput"
                placeholder="e.g. P001"
                autocomplete="off"
                class="w-full px-4 py-3 rounded-xl bg-white/20 border border-white/40 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-400 mb-2"
                onkeydown="if(event.key==='Enter') confirmParticipantId()"
            />
            <p id="participantError" class="text-red-300 text-xs text-left mb-3 min-h-[1rem]"></p>
            <button
                id="startSessionButton"
                onclick="confirmParticipantId()"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold transition"
            >
                Start Session →
            </button>
        </div>
    </div>

    <div class="flex flex-col h-screen">
        <!-- Header -->
        <div class="bg-white/10 backdrop-blur-md border-b border-white/20 px-4 py-3">
            <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold">🎮IRIS : Your Game Buddy</h1>
                    <p class="text-purple-200 text-xs sm:text-sm">Your friendly co-op decision maker</p>
                </div>
                <div class="flex items-center gap-3">
                    <span id="participantBadge" class="text-xs bg-white/20 text-purple-100 px-3 py-1 rounded-full hidden"></span>
                    <button
                        onclick="startNewSession()"
                        class="bg-red-600 hover:bg-red-700 text-white px-3 sm:px-4 py-2 rounded-lg text-sm transition"
                        title="Start a completely new session"
                    >
                        🔄 New Session
                    </button>
                </div>
            </div>
        </div>

        <!-- Thread -->
        <div id="threadContainer" class="flex-1 overflow-y-auto px-4 py-6">
            <div id="thread" class="max-w-6xl mx-auto space-y-6"></div>

            <!-- Landing: "Ask anything" -->
            <div id="hero" class="max-w-3xl mx-auto min-h-full flex flex-col items-center justify-center text-center pb-16">
                <div class="text-5xl mb-4">🎮</div>
                <h2 class="text-3xl sm:text-4xl font-bold mb-2">Ask anything</h2>
                <p class="text-purple-200 text-sm mb-8 max-w-md">
                    Describe what's happening in the game, then tap <strong>+</strong> to add the two options you're choosing between.
                </p>
                <div id="heroSlot" class="w-full"></div>
            </div>
        </div>

        <!-- Bottom dock (composer moves here after the first decision) -->
        <div id="dock" class="hidden bg-white/10 backdrop-blur-md border-t border-white/20 px-4 py-4">
            <div id="dockSlot" class="max-w-3xl mx-auto"></div>
        </div>
    </div>

    <!-- Composer: situation text + "+" options form + mic -->
    <div id="composer" class="w-full text-left">
        <div id="optionsForm" class="hidden fade-in mb-3 bg-white/15 backdrop-blur-md border border-white/30 rounded-2xl p-4 shadow-xl">
            <div class="flex items-center justify-between mb-3">
                <p class="text-xs font-semibold text-purple-200 uppercase tracking-wide">The two options in the game</p>
                <button onclick="toggleOptionsForm(false)" class="text-white/60 hover:text-white text-lg leading-none" title="Close">×</button>
            </div>
            <div class="grid sm:grid-cols-2 gap-3 mb-3">
                <div>
                    <label for="optionAInput" class="text-purple-200 text-xs mb-1 block">Option A</label>
                    <input type="text" id="optionAInput" placeholder="e.g. Calm" autocomplete="off"
                        class="w-full px-3 py-2 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/50 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                        onkeydown="if(event.key==='Enter') document.getElementById('optionBInput').focus()"/>
                </div>
                <div>
                    <label for="optionBInput" class="text-purple-200 text-xs mb-1 block">Option B</label>
                    <input type="text" id="optionBInput" placeholder="e.g. Rebuke" autocomplete="off"
                        class="w-full px-3 py-2 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/50 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"
                        onkeydown="if(event.key==='Enter') saveOptions()"/>
                </div>
            </div>
            <button onclick="saveOptions()" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg text-sm font-semibold transition">
                Add options
            </button>
        </div>

        <div id="optionChips" class="hidden flex flex-wrap gap-2 mb-2"></div>

        <div class="flex items-end gap-1 bg-white rounded-3xl pl-2 pr-2 py-2 shadow-2xl">
            <button id="plusButton" onclick="toggleOptionsForm()"
                class="shrink-0 w-10 h-10 rounded-full text-gray-600 hover:bg-gray-100 text-2xl leading-none flex items-center justify-center transition"
                title="Add Option A and Option B" aria-label="Add Option A and Option B">+</button>
            <textarea id="situationInput" rows="1" placeholder="Ask anything"
                class="flex-1 min-w-0 py-2 px-2 resize-none bg-transparent text-gray-900 placeholder-gray-400 focus:outline-none max-h-40"
                oninput="autoGrow(this)"
                onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendSituation();}"></textarea>
            <button id="composerMic" onclick="toggleDictation(document.getElementById('situationInput'), this)"
                class="shrink-0 w-10 h-10 rounded-full text-gray-600 hover:bg-gray-100 flex items-center justify-center transition"
                title="Speak" aria-label="Speak">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/></svg>
            </button>
            <button id="composerSend" onclick="sendSituation()"
                class="shrink-0 w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-700 text-white flex items-center justify-center transition disabled:opacity-40"
                title="Send" aria-label="Send">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
        </div>
        <p id="composerHint" class="text-xs text-purple-200 mt-2 px-3 min-h-[1rem]"></p>
    </div>

    <script>
        const API_BASE_URL = location.protocol.startsWith('http') ? '' : 'http://localhost:5000';
        const MIC_SVG = document.getElementById('composerMic').innerHTML;

        let sessionId = null;
        let participantId = null;
        let maxFollowups = 5;
        let minReasonWords = 5;
        let pendingOptions = { A: '', B: '' };
        const decisions = {};   // decision_number -> client-side state

        // ── Helpers ─────────────────────────────────────────────────
        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function wordCount(text) {
            return (text.match(/[A-Za-z']+/g) || []).length;
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function scrollToBottom() {
            const c = document.getElementById('threadContainer');
            c.scrollTop = c.scrollHeight;
        }

        async function api(path, body = {}) {
            const response = await fetch(API_BASE_URL + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, ...body })
            });
            const data = await response.json().catch(() => ({ success: false, error: `Server error (${response.status})` }));
            if (!response.ok || !data.success) throw new Error(data.error || `Server error (${response.status})`);
            return data;
        }

        // ── Participant + session ───────────────────────────────────
        async function confirmParticipantId() {
            const input = document.getElementById('participantIdInput');
            const val = input.value.trim();
            if (!val) { input.focus(); return; }
            participantId = val;
            await initializeSession();
        }

        window.onload = function () {
            const savedPid = localStorage.getItem('iris_v2_participant_id');
            sessionId = localStorage.getItem('iris_v2_session_id');
            if (savedPid) {
                participantId = savedPid;
                initializeSession();
            } else {
                document.getElementById('participantIdInput').focus();
            }
            placeComposer();
        };

        async function initializeSession() {
            const errorEl = document.getElementById('participantError');
            const btn = document.getElementById('startSessionButton');
            errorEl.textContent = '';
            btn.disabled = true;
            try {
                const data = await api('/api/start-session', { participant_id: participantId });
                sessionId = data.session_id;
                maxFollowups = data.max_followups;
                minReasonWords = data.min_reason_words;
                localStorage.setItem('iris_v2_session_id', sessionId);
                localStorage.setItem('iris_v2_participant_id', participantId);

                document.getElementById('participantModal').classList.add('hidden');
                const badge = document.getElementById('participantBadge');
                badge.textContent = '👤 ' + participantId;
                badge.classList.remove('hidden');
                document.getElementById('situationInput').focus();
            } catch (e) {
                document.getElementById('participantModal').classList.remove('hidden');
                errorEl.textContent = '⚠️ Could not connect to the IRIS server. Make sure backend.py is running.';
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        function startNewSession() {
            if (confirm('Start a new session? This will clear the screen.')) {
                localStorage.removeItem('iris_v2_session_id');
                localStorage.removeItem('iris_v2_participant_id');
                window.location.reload();
            }
        }

        // ── Composer ────────────────────────────────────────────────
        function placeComposer() {
            const composer = document.getElementById('composer');
            const hasDecisions = Object.keys(decisions).length > 0;
            document.getElementById('hero').classList.toggle('hidden', hasDecisions);
            document.getElementById('dock').classList.toggle('hidden', !hasDecisions);
            document.getElementById(hasDecisions ? 'dockSlot' : 'heroSlot').appendChild(composer);
        }

        function setComposerVisible(visible) {
            document.getElementById('composer').classList.toggle('hidden', !visible);
            if (Object.keys(decisions).length > 0) {
                document.getElementById('dock').classList.toggle('hidden', !visible);
            }
        }

        function toggleOptionsForm(force) {
            const form = document.getElementById('optionsForm');
            const show = force ?? form.classList.contains('hidden');
            form.classList.toggle('hidden', !show);
            if (show) {
                document.getElementById('optionAInput').value = pendingOptions.A;
                document.getElementById('optionBInput').value = pendingOptions.B;
                document.getElementById('optionAInput').focus();
            }
        }

        function saveOptions() {
            const a = document.getElementById('optionAInput').value.trim();
            const b = document.getElementById('optionBInput').value.trim();
            const hint = document.getElementById('composerHint');
            if (!a || !b) {
                hint.textContent = 'Please fill in both Option A and Option B.';
                (a ? document.getElementById('optionBInput') : document.getElementById('optionAInput')).focus();
                return;
            }
            if (a.toLowerCase() === b.toLowerCase()) {
                hint.textContent = 'Option A and Option B need to be different.';
                return;
            }
            pendingOptions = { A: a, B: b };
            hint.textContent = '';
            toggleOptionsForm(false);
            renderOptionChips();
            document.getElementById('situationInput').focus();
        }

        function renderOptionChips() {
            const chips = document.getElementById('optionChips');
            if (!pendingOptions.A) { chips.classList.add('hidden'); chips.innerHTML = ''; return; }
            chips.classList.remove('hidden');
            chips.innerHTML = ['A', 'B'].map(label => `
                <button onclick="toggleOptionsForm(true)" title="Edit options"
                    class="bg-white/20 hover:bg-white/30 border border-white/30 text-white text-sm px-3 py-1 rounded-full transition">
                    <strong>Option ${label}:</strong> ${esc(pendingOptions[label])}
                </button>`).join('') + `
                <button onclick="pendingOptions={A:'',B:''}; renderOptionChips();" title="Remove options"
                    class="text-white/60 hover:text-white text-sm px-2">×</button>`;
        }

        async function sendSituation() {
            const input = document.getElementById('situationInput');
            const hint = document.getElementById('composerHint');
            const situation = input.value.trim();
            if (!situation) {
                hint.textContent = "Describe what's happening in the game first.";
                input.focus();
                return;
            }
            if (!pendingOptions.A || !pendingOptions.B) {
                hint.textContent = 'Tap + to add Option A and Option B.';
                toggleOptionsForm(true);
                return;
            }
            hint.textContent = '';
            stopDictation();
            const sendBtn = document.getElementById('composerSend');
            sendBtn.disabled = true;
            try {
                const data = await api('/api/decision/start', {
                    situation, option_a: pendingOptions.A, option_b: pendingOptions.B
                });
                const n = data.decision_number;
                decisions[n] = {
                    n, situation, a: pendingOptions.A, b: pendingOptions.B,
                    status: 'awaiting_reasons', initialChoice: null, choice: null,
                    followupsUsed: 0, busy: false, editing: null
                };
                input.value = '';
                autoGrow(input);
                pendingOptions = { A: '', B: '' };
                renderOptionChips();
                placeComposer();
                setComposerVisible(false);
                renderDecision(n);
            } catch (e) {
                hint.textContent = '⚠️ ' + e.message;
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ── Decision block ──────────────────────────────────────────
        function renderDecision(n) {
            const d = decisions[n];
            const el = document.createElement('section');
            el.id = `decision-${n}`;
            el.className = 'fade-in bg-white/10 border border-white/20 rounded-2xl p-4 sm:p-5';
            el.innerHTML = `
                <div class="mb-4">
                    <p class="text-xs font-semibold text-purple-200 uppercase tracking-wide mb-1">📍 Decision Point #${n}</p>
                    <p class="text-white/90">${esc(d.situation)}</p>
                </div>
                <div class="grid gap-4 lg:grid-cols-3">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="grid md:grid-cols-2 gap-4">
                            ${optionCard(n, 'A', d.a)}
                            ${optionCard(n, 'B', d.b)}
                        </div>
                        <div class="bg-white/5 border border-white/15 rounded-xl p-4">
                            <p id="choice-label-${n}" class="text-sm font-medium mb-2">Which option would you choose?</p>
                            <div class="flex gap-2" id="choice-${n}">
                                ${['A', 'B'].map(l => `
                                    <button data-choice="${l}" onclick="selectChoice(${n}, '${l}')"
                                        class="choice-btn flex-1 py-2 px-3 rounded-lg border border-white/40 text-sm hover:bg-white/20 transition text-left">
                                        <strong>(${l})</strong> ${esc(l === 'A' ? d.a : d.b)}
                                    </button>`).join('')}
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-3">
                            <button id="submit-${n}" onclick="submitReasons(${n})"
                                class="bg-purple-600 hover:bg-purple-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition">
                                Submit my reasoning →
                            </button>
                            <button id="finish-${n}" onclick="finishDecision(${n})"
                                class="hidden bg-green-600 hover:bg-green-700 disabled:opacity-40 disabled:cursor-not-allowed text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition">
                            </button>
                            <p id="status-${n}" class="text-sm text-red-300"></p>
                        </div>
                    </div>
                    ${irisPanel(n)}
                </div>
            `;
            document.getElementById('thread').appendChild(el);
            document.getElementById(`reason-${n}-A`).focus();
            scrollToBottom();
        }

        function optionCard(n, label, text) {
            return `
                <div class="bg-white/15 border border-white/25 rounded-xl p-4 flex flex-col">
                    <p class="text-xs font-semibold text-purple-200 uppercase tracking-wide">Option ${label}</p>
                    <p class="text-lg font-bold mb-3 break-words">${esc(text)}</p>
                    <label for="reason-${n}-${label}" class="text-sm text-purple-100 mb-1">Why does this option make sense?</label>
                    <div id="reason-edit-${n}-${label}">
                        <textarea id="reason-${n}-${label}" rows="4"
                            placeholder="Explain your thinking in your own words…"
                            oninput="updateWordCount(${n}, '${label}')"
                            class="w-full px-3 py-2 resize-none bg-white/90 text-gray-900 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"></textarea>
                        <div class="flex justify-between items-center mt-1">
                            <span id="wc-${n}-${label}" class="text-xs text-white/50">0 words (min ${minReasonWords})</span>
                            <span id="edit-actions-${n}-${label}" class="hidden gap-2">
                                <button onclick="cancelEdit(${n}, '${label}')" class="text-xs text-white/70 hover:text-white">Cancel</button>
                                <button onclick="saveEdit(${n}, '${label}')" class="text-xs bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded">Save</button>
                            </span>
                        </div>
                    </div>
                    <div id="reason-view-${n}-${label}" class="hidden">
                        <p id="reason-text-${n}-${label}" class="text-sm bg-white/10 rounded-lg px-3 py-2 whitespace-pre-wrap break-words"></p>
                        <button id="edit-btn-${n}-${label}" onclick="startEdit(${n}, '${label}')"
                            class="text-xs text-purple-200 hover:text-white mt-1">✏️ Edit my reason</button>
                    </div>
                    <p id="reason-error-${n}-${label}" class="text-xs text-red-300 mt-1"></p>
                </div>`;
        }

        function irisPanel(n) {
            return `
                <aside id="iris-${n}" class="bg-white/95 text-gray-800 rounded-xl shadow-lg flex flex-col min-h-[16rem] max-h-[36rem]">
                    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200">
                        <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center text-sm">🤖</div>
                        <div>
                            <p class="font-semibold text-sm">IRIS</p>
                            <p id="iris-status-${n}" class="text-xs text-gray-500">Waiting for your reasoning</p>
                        </div>
                    </div>
                    <div id="iris-body-${n}" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 text-sm">
                        <div id="iris-locked-${n}" class="h-full flex flex-col items-center justify-center text-center text-gray-500 py-6">
                            <div class="text-3xl mb-2">🔒</div>
                            <p>IRIS will share its opinion once you've explained <strong>both</strong> options and picked one.</p>
                        </div>
                    </div>
                    <div id="iris-footer-${n}" class="hidden border-t border-gray-200 p-3">
                        <div class="flex items-center justify-between text-xs text-gray-500 mb-2">
                            <span id="fu-counter-${n}">Follow-up 0 / ${maxFollowups}</span>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="fu-input-${n}" placeholder="Ask IRIS a follow-up…"
                                onkeydown="if(event.key==='Enter'){event.preventDefault(); sendFollowup(${n});}"
                                class="flex-1 min-w-0 px-3 py-2 bg-gray-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"/>
                            <button id="fu-mic-${n}" onclick="toggleDictation(document.getElementById('fu-input-${n}'), this)"
                                class="shrink-0 w-9 h-9 rounded-full text-gray-600 hover:bg-gray-200 flex items-center justify-center transition" title="Speak">${MIC_SVG}</button>
                            <button id="fu-send-${n}" onclick="sendFollowup(${n})"
                                class="shrink-0 bg-purple-600 hover:bg-purple-700 disabled:opacity-40 text-white px-4 rounded-full text-sm transition">Send</button>
                        </div>
                    </div>
                </aside>`;
        }

        function updateWordCount(n, label) {
            const count = wordCount(document.getElementById(`reason-${n}-${label}`).value);
            const el = document.getElementById(`wc-${n}-${label}`);
            el.textContent = `${count} word${count === 1 ? '' : 's'} (min ${minReasonWords})`;
            el.className = 'text-xs ' + (count >= minReasonWords ? 'text-green-300' : 'text-white/50');
            document.getElementById(`reason-error-${n}-${label}`).textContent = '';
            if (decisions[n].status === 'awaiting_reasons') document.getElementById(`status-${n}`).textContent = '';
        }

        function paintChoice(n) {
            const d = decisions[n];
            document.querySelectorAll(`#choice-${n} .choice-btn`).forEach(btn => {
                const selected = btn.dataset.choice === d.choice;
                btn.classList.toggle('bg-purple-600', selected);
                btn.classList.toggle('border-purple-300', selected);
                btn.classList.toggle('border-white/40', !selected);
            });
            const finishBtn = document.getElementById(`finish-${n}`);
            if (d.choice) {
                finishBtn.textContent = `✅ Lock in final choice: (${d.choice}) ${d.choice === 'A' ? d.a : d.b}`;
            }
        }

        async function selectChoice(n, label) {
            const d = decisions[n];
            if (d.status === 'finished' || d.busy) return;
            if (d.status === 'awaiting_reasons') {
                d.choice = label;
                document.getElementById(`status-${n}`).textContent = '';
                paintChoice(n);
                return;
            }
            // After IRIS: switching is logged on the server
            if (label === d.choice) return;
            const previous = d.choice;
            d.choice = label;
            paintChoice(n);
            try {
                await api('/api/decision/change-choice', { decision_number: n, choice: label });
            } catch (e) {
                d.choice = previous;
                paintChoice(n);
                document.getElementById(`status-${n}`).textContent = '⚠️ ' + e.message;
            }
        }

        function setBusy(n, busy) {
            const d = decisions[n];
            d.busy = busy;
            document.getElementById(`submit-${n}`).disabled = busy;
            document.getElementById(`finish-${n}`).disabled = busy;
            const send = document.getElementById(`fu-send-${n}`);
            if (send) send.disabled = busy || d.followupsUsed >= maxFollowups;
        }

        async function submitReasons(n) {
            const d = decisions[n];
            const status = document.getElementById(`status-${n}`);
            const reasons = {
                A: document.getElementById(`reason-${n}-A`).value.trim(),
                B: document.getElementById(`reason-${n}-B`).value.trim()
            };
            let ok = true;
            for (const label of ['A', 'B']) {
                const errEl = document.getElementById(`reason-error-${n}-${label}`);
                errEl.textContent = '';
                if (wordCount(reasons[label]) < minReasonWords) {
                    errEl.textContent = `Please write at least ${minReasonWords} words.`;
                    ok = false;
                }
            }
            status.textContent = '';
            if (!d.choice) { status.textContent = 'Pick the option you would choose.'; ok = false; }
            if (!ok) return;

            setBusy(n, true);
            status.className = 'text-sm text-purple-200';
            status.textContent = 'Checking your reasoning…';
            setIrisStatus(n, 'Reading your reasoning…');
            try {
                const data = await api('/api/decision/submit-reasons', {
                    decision_number: n, reason_a: reasons.A, reason_b: reasons.B, initial_choice: d.choice
                });
                if (!data.accepted) {
                    for (const [label, problem] of Object.entries(data.problems)) {
                        document.getElementById(`reason-error-${n}-${label}`).textContent = problem;
                    }
                    status.className = 'text-sm text-red-300';
                    status.textContent = 'Please fix the highlighted reason before IRIS can respond.';
                    setIrisStatus(n, 'Waiting for your reasoning');
                    return;
                }
                status.textContent = '';
                d.status = 'discussing';
                d.initialChoice = d.choice;
                for (const label of ['A', 'B']) showReason(n, label, reasons[label]);
                document.getElementById(`submit-${n}`).classList.add('hidden');
                document.getElementById(`finish-${n}`).classList.remove('hidden');
                document.getElementById(`choice-label-${n}`).textContent = 'Your current choice (you can switch at any time):';
                paintChoice(n);
                showOpinion(n, data);
            } catch (e) {
                status.className = 'text-sm text-red-300';
                status.textContent = '⚠️ ' + e.message;
                setIrisStatus(n, 'Waiting for your reasoning');
            } finally {
                setBusy(n, false);
            }
        }

        function showReason(n, label, text) {
            document.getElementById(`reason-text-${n}-${label}`).textContent = text;
            document.getElementById(`reason-edit-${n}-${label}`).classList.add('hidden');
            document.getElementById(`reason-view-${n}-${label}`).classList.remove('hidden');
            document.getElementById(`edit-actions-${n}-${label}`).classList.add('hidden');
            document.getElementById(`reason-error-${n}-${label}`).textContent = '';
        }

        function startEdit(n, label) {
            const d = decisions[n];
            if (d.status !== 'discussing') return;
            const textarea = document.getElementById(`reason-${n}-${label}`);
            textarea.value = document.getElementById(`reason-text-${n}-${label}`).textContent;
            updateWordCount(n, label);
            document.getElementById(`reason-view-${n}-${label}`).classList.add('hidden');
            document.getElementById(`reason-edit-${n}-${label}`).classList.remove('hidden');
            const actions = document.getElementById(`edit-actions-${n}-${label}`);
            actions.classList.remove('hidden');
            actions.classList.add('flex');
            textarea.focus();
        }

        function cancelEdit(n, label) {
            showReason(n, label, document.getElementById(`reason-text-${n}-${label}`).textContent);
        }

        async function saveEdit(n, label) {
            const text = document.getElementById(`reason-${n}-${label}`).value.trim();
            const errEl = document.getElementById(`reason-error-${n}-${label}`);
            if (wordCount(text) < minReasonWords) {
                errEl.textContent = `Please write at least ${minReasonWords} words.`;
                return;
            }
            setBusy(n, true);
            errEl.className = 'text-xs text-purple-200 mt-1';
            errEl.textContent = 'Checking…';
            try {
                const data = await api('/api/decision/edit-reason', { decision_number: n, option: label, reason: text });
                errEl.className = 'text-xs text-red-300 mt-1';
                if (!data.accepted) {
                    errEl.textContent = data.problems[label];
                    return;
                }
                showReason(n, label, text);
            } catch (e) {
                errEl.className = 'text-xs text-red-300 mt-1';
                errEl.textContent = '⚠️ ' + e.message;
            } finally {
                setBusy(n, false);
            }
        }

        // ── IRIS panel ──────────────────────────────────────────────
        function setIrisStatus(n, text) {
            const el = document.getElementById(`iris-status-${n}`);
            if (el) el.textContent = text;
        }

        function irisBubble(role, text) {
            const div = document.createElement('div');
            div.className = `fade-in flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const cls = role === 'user'
                ? 'bg-purple-600 text-white rounded-br-none'
                : 'bg-gray-100 text-gray-800 rounded-bl-none';
            div.innerHTML = `<p class="max-w-[90%] px-3 py-2 rounded-2xl ${cls} whitespace-pre-wrap leading-relaxed">${esc(text)}</p>`;
            return div;
        }

        function irisTyping(n) {
            const div = document.createElement('div');
            div.id = `iris-typing-${n}`;
            div.className = 'flex justify-start';
            div.innerHTML = `
                <div class="bg-gray-100 px-3 py-3 rounded-2xl rounded-bl-none flex gap-1">
                    <div class="w-2 h-2 bg-purple-500 rounded-full bounce-1"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full bounce-2"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full bounce-3"></div>
                </div>`;
            return div;
        }

        function appendToIris(n, node) {
            const body = document.getElementById(`iris-body-${n}`);
            document.getElementById(`iris-locked-${n}`)?.remove();
            body.appendChild(node);
            body.scrollTop = body.scrollHeight;
        }

        function showOpinion(n, data) {
            if (data.opinion) {
                appendToIris(n, irisBubble('assistant', data.opinion));
                setIrisStatus(n, 'Ask a follow-up, or lock in your choice');
                document.getElementById(`iris-footer-${n}`).classList.remove('hidden');
                updateFollowupCounter(n);
                return;
            }
            // Reasons were accepted but the opinion failed: offer a retry
            setIrisStatus(n, 'Something went wrong');
            const retry = document.createElement('div');
            retry.id = `iris-retry-${n}`;
            retry.className = 'text-center text-gray-600 py-4';
            retry.innerHTML = `
                <p class="mb-2">⚠️ IRIS couldn't respond: ${esc(data.opinion_error || 'unknown error')}</p>
                <button onclick="retryOpinion(${n})" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-1.5 rounded-lg text-sm">Try again</button>`;
            appendToIris(n, retry);
        }

        async function retryOpinion(n) {
            document.getElementById(`iris-retry-${n}`)?.remove();
            appendToIris(n, irisTyping(n));
            setBusy(n, true);
            try {
                const data = await api('/api/decision/opinion', { decision_number: n });
                document.getElementById(`iris-typing-${n}`)?.remove();
                showOpinion(n, data);
            } catch (e) {
                document.getElementById(`iris-typing-${n}`)?.remove();
                showOpinion(n, { opinion: null, opinion_error: e.message });
            } finally {
                setBusy(n, false);
            }
        }

        function updateFollowupCounter(n) {
            const d = decisions[n];
            document.getElementById(`fu-counter-${n}`).textContent = `Follow-up ${d.followupsUsed} / ${maxFollowups}`;
            const input = document.getElementById(`fu-input-${n}`);
            const done = d.followupsUsed >= maxFollowups;
            input.disabled = done;
            input.placeholder = done ? 'No follow-ups left. Lock in your choice.' : 'Ask IRIS a follow-up…';
            document.getElementById(`fu-send-${n}`).disabled = done || d.busy;
        }

        async function sendFollowup(n) {
            const d = decisions[n];
            const input = document.getElementById(`fu-input-${n}`);
            const question = input.value.trim();
            if (!question || d.busy || d.followupsUsed >= maxFollowups || d.status !== 'discussing') return;
            stopDictation();
            const askedAt = new Date().toISOString();
            input.value = '';
            appendToIris(n, irisBubble('user', question));
            appendToIris(n, irisTyping(n));
            setIrisStatus(n, 'Thinking…');
            setBusy(n, true);
            try {
                const data = await api('/api/decision/followup', { decision_number: n, message: question, asked_at: askedAt });
                document.getElementById(`iris-typing-${n}`)?.remove();
                appendToIris(n, irisBubble('assistant', data.response));
                d.followupsUsed = data.followups_used;
                setIrisStatus(n, 'Ask a follow-up, or lock in your choice');
            } catch (e) {
                document.getElementById(`iris-typing-${n}`)?.remove();
                const err = document.createElement('p');
                err.className = 'text-xs text-red-500 text-center';
                err.textContent = '⚠️ ' + e.message;
                appendToIris(n, err);
                input.value = question;
                setIrisStatus(n, 'Ask a follow-up, or lock in your choice');
            } finally {
                setBusy(n, false);
                updateFollowupCounter(n);
            }
        }

        // ── Finish ──────────────────────────────────────────────────
        async function finishDecision(n) {
            const d = decisions[n];
            if (d.busy || !d.choice) return;
            setBusy(n, true);
            const status = document.getElementById(`status-${n}`);
            try {
                await api('/api/decision/finish', { decision_number: n, final_choice: d.choice });
                d.status = 'finished';
                lockDecision(n);
                setComposerVisible(true);
                document.getElementById('situationInput').focus();
                scrollToBottom();
            } catch (e) {
                status.className = 'text-sm text-red-300';
                status.textContent = '⚠️ ' + e.message;
                setBusy(n, false);
            }
        }

        function lockDecision(n) {
            const d = decisions[n];
            const el = document.getElementById(`decision-${n}`);
            el.querySelectorAll('button, input, textarea').forEach(x => {
                if (!x.classList.contains('choice-btn')) x.disabled = true;
            });
            el.querySelectorAll('.choice-btn').forEach(x => {
                x.disabled = true;
                x.classList.remove('hover:bg-white/20');
                if (x.dataset.choice !== d.choice) x.classList.add('opacity-40');
            });
            ['A', 'B'].forEach(label => document.getElementById(`edit-btn-${n}-${label}`).classList.add('hidden'));
            document.getElementById(`choice-label-${n}`).textContent = 'Your final choice:';
            document.getElementById(`iris-footer-${n}`)?.classList.add('hidden');
            setIrisStatus(n, 'Decision finished');
            const finishBtn = document.getElementById(`finish-${n}`);
            finishBtn.outerHTML = `
                <span class="bg-green-600/30 border border-green-400/40 text-green-200 px-4 py-2 rounded-full text-sm">
                    ✅ Decision #${n} recorded: (${d.choice}) ${esc(d.choice === 'A' ? d.a : d.b)}
                </span>`;
        }

        // ── Voice input ─────────────────────────────────────────────
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let dictationTarget = null;
        let dictationButton = null;
        let dictationBase = '';

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = 0; i < event.results.length; i++) transcript += event.results[i][0].transcript;
                dictationTarget.value = (dictationBase ? dictationBase + ' ' : '') + transcript;
                if (dictationTarget.tagName === 'TEXTAREA') autoGrow(dictationTarget);
            };
            recognition.onend = recognition.onerror = () => {
                if (dictationButton) dictationButton.classList.remove('recording');
                dictationTarget = dictationButton = null;
            };
        } else {
            document.getElementById('composerMic').title = 'Voice input is not supported in this browser';
            document.getElementById('composerMic').classList.add('opacity-40');
        }

        function toggleDictation(target, button) {
            if (!recognition) {
                document.getElementById('composerHint').textContent = 'Voice input is not supported in this browser. Try Chrome or Edge.';
                return;
            }
            if (dictationTarget) {
                stopDictation();
                return;
            }
            dictationTarget = target;
            dictationButton = button;
            dictationBase = target.value.trim();
            button.classList.add('recording');
            recognition.start();
        }

        function stopDictation() {
            if (recognition && dictationTarget) recognition.stop();
        }
    </script>
</body>
</html>
